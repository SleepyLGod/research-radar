[project]
name = "research-radar"
version = "0.1.0"
description = "Privacy-first research intelligence system for evidence-backed briefs and draft publishing."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "ResearchRadar Maintainers" }
]
dependencies = [
  "cryptography>=42.0.0",
  "keyring>=25.0.0",
  "pillow>=10.0.0",
  "pypdf>=5.0.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
app-build = [
  "pyinstaller>=6.22,<7",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
research-radar = "research_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".uv-cache", ".pytest_cache", "runs", "data", "cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
