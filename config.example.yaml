project:
  name: ResearchRadar

topics:
  - id: agent-memory
    source_intent: research_brief
    queries:
      - "agent memory systems"
      - "LLM memory benchmark"
    paper_queries:
      - "Memory in the LLM Era"
      - "LLM agent memory benchmark"
      - "LOCOMO LongMemEval agent memory"
      - "long term memory LLM agents"
    web_queries:
      - "agent memory systems paper"
      - "LLM agent memory benchmark blog"
      - "LOCOMO LongMemEval official"
    exclusion_terms:
      - "translation memory"
      - "cache-only inference"
    priority_sources:
      - arxiv.org
      - semanticscholar.org
      - openalex.org
      - github.com
      - openreview.net

discovery:
  trusted_domains:
    - arxiv.org
    - semanticscholar.org
    - openalex.org
    - openreview.net
    - aclanthology.org
  web_search:
    endpoint:
    header_secret_name:

cadence:
  daily_monitor: "09:00"
  weekly_deep_dive: "Sunday 10:00"

models:
  scout: deepseek-v4-flash
  analyst: deepseek-v4-pro
  verifier: codex_or_openai_high_reasoning

publishing:
  channel: wechat_draft
  auto_publish: false

security:
  secret_backend: keychain
  encrypt_storage: true
