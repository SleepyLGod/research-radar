project:
  name: ResearchRadar

topics:
  - id: example-topic
    source_intent: research_brief
    report_language: en
    queries:
      - "your research topic"
      - "your topic benchmark"
    paper_queries:
      - "your topic survey"
      - "your topic benchmark paper"
    web_queries:
      - "your topic paper"
      - "your topic technical report"
    priority_sources:
      - arxiv.org
      - openreview.net

discovery:
  trusted_domains:
    - arxiv.org
    - semanticscholar.org
    - openalex.org
    - openreview.net
    - aclanthology.org
  web_search:
    provider: tavily
    endpoint:
    header_secret_name: web_search.api_key
    max_results: 5
    search_depth: basic
    timeout_seconds: 30

cadence:
  daily_monitor: "09:00"
  weekly_deep_dive: "Sunday 10:00"

model_providers:
  deepseek:
    kind: openai_compatible
    base_url: https://api.deepseek.com/chat/completions
    api_key_secret: deepseek.api_key
  codex:
    kind: codex_cli
    command: /Applications/ChatGPT.app/Contents/Resources/codex
    timeout_seconds: 900
    reasoning_effort: high
  local:
    kind: local

models:
  scout: deepseek-v4-flash
  analyst: deepseek-v4-pro
  verifier: codex_or_openai_high_reasoning
  task_routes:
    topic_bootstrap:
      provider: deepseek
      model: deepseek-v4-flash
    source_gist:
      provider: deepseek
      model: deepseek-v4-flash
    deep_reading:
      provider: deepseek
      model: deepseek-v4-pro
    anchor_repair:
      provider: deepseek
      model: deepseek-v4-pro
    report_localization:
      provider: deepseek
      model: deepseek-v4-flash
    verifier:
      provider: codex
      model: gpt-5.6-terra

publishing:
  channel: wechat_draft
  auto_publish: false

security:
  secret_backend: keychain
  encrypt_storage: true
