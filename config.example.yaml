project:
  name: ResearchRadar

topics:
  - id: agent-memory
    source_intent: research_brief
    report_language: en
    queries:
      - "agent memory systems"
      - "LLM memory benchmark"
    paper_queries:
      - "Memory in the LLM Era"
      - "LLM agent memory benchmark"
      - "LOCOMO LongMemEval agent memory"
      - "long term memory LLM agents"
    web_queries:
      - "agent memory systems paper"
      - "LLM agent memory benchmark blog"
      - "LOCOMO LongMemEval official"
    exclusion_terms:
      - "translation memory"
      - "cache-only inference"
    required_phrases:
      - "agent memory"
      - "LLM agent memory"
      - "LLM memory"
      - "agentic memory"
      - "conversational memory"
      - "episodic memory"
      - "long-term memory for agents"
      - "persistent recall"
      - "LOCOMO"
      - "LongMemEval"
    negative_phrases:
      - "prefill serving"
      - "kv cache"
      - "retrieval adapter"
      - "planning problems"
      - "activation quantization"
      - "moe serving"
    concept_groups:
      agent_context:
        - "agent memory"
        - "LLM agent memory"
        - "agentic memory"
        - "autonomous LLM agents"
        - "conversational agents"
        - "AI agents"
      memory_mechanism:
        - "memory retrieval"
        - "agent recall"
        - "persistent recall"
        - "long-term memory"
        - "episodic memory"
        - "conversational memory"
        - "memory management"
        - "memory systems"
      evaluation_signal:
        - "LOCOMO"
        - "LongMemEval"
        - "agent memory benchmark"
        - "memory evaluation"
        - "conversational memory benchmark"
      negative_compute_or_training:
        - "prefill serving"
        - "kv cache"
        - "retrieval adapter"
        - "planning problems"
        - "activation quantization"
        - "moe serving"
        - "fine-tuning"
        - "QLoRA"
    priority_sources:
      - arxiv.org
      - semanticscholar.org
      - openalex.org
      - github.com
      - openreview.net

discovery:
  trusted_domains:
    - arxiv.org
    - semanticscholar.org
    - openalex.org
    - openreview.net
    - aclanthology.org
  web_search:
    endpoint:
    header_secret_name:

cadence:
  daily_monitor: "09:00"
  weekly_deep_dive: "Sunday 10:00"

model_providers:
  deepseek:
    kind: openai_compatible
    base_url: https://api.deepseek.com/chat/completions
    api_key_secret: deepseek.api_key
  openai:
    kind: openai_compatible
    base_url: https://api.openai.com/v1/chat/completions
    api_key_secret: openai.api_key
  anthropic:
    kind: anthropic_messages
    api_key_secret: anthropic.api_key
  codex:
    kind: codex_cli
    command: /Applications/Codex.app/Contents/Resources/codex
    timeout_seconds: 900
  claude:
    kind: claude_code_cli
    command: claude
    timeout_seconds: 900
  von_claude:
    kind: claude_code_cli
    command: von-claude
    timeout_seconds: 900
  local:
    kind: local

models:
  scout: deepseek-v4-flash
  analyst: deepseek-v4-pro
  verifier: codex_or_openai_high_reasoning
  task_routes:
    topic_bootstrap:
      provider: deepseek
      model: deepseek-chat
    source_gist:
      provider: deepseek
      model: deepseek-chat
    deep_reading:
      provider: deepseek
      model: deepseek-v4-pro
    anchor_repair:
      provider: deepseek
      model: deepseek-v4-pro
    verifier:
      provider: von_claude
      model: sonnet

publishing:
  channel: wechat_draft
  auto_publish: false

security:
  secret_backend: keychain
  encrypt_storage: true
